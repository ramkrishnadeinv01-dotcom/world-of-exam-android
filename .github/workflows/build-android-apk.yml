name: Build World of Exam Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev typescript@5.9.3

      - name: Prepare web asset directory
        run: mkdir -p www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install World of Exam Android download handler
        run: |
          mkdir -p android/app/src/main/java/in/worldofexam/app
          cp android-src/in/worldofexam/app/MainActivity.java android/app/src/main/java/in/worldofexam/app/MainActivity.java

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add all four Android signing secrets before running this release workflow. See README.md."
            exit 1
          fi

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/world-of-exam-release.jks"
          test -s "$RUNNER_TEMP/world-of-exam-release.jks"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('Expected Capacitor Groovy file android/app/build.gradle was not found.')
          s = p.read_text()
          if 'signingConfigs' in s and 'worldOfExamRelease' in s:
              raise SystemExit('Release signing appears to be configured already; refusing to duplicate it.')
          signing = '''    signingConfigs {
              worldOfExamRelease {
                  storeFile file(System.getenv("RUNNER_TEMP") + "/world-of-exam-release.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
          if not re.search(r'(?m)^android\s*\{', s):
              raise SystemExit('Could not locate android { } block in app/build.gradle.')
          s = re.sub(r'(?m)^(android\s*\{)', r'\1\n' + signing, s, count=1)
          release_block = re.search(r'(?s)buildTypes\s*\{(.*?)\n\s*\}', s)
          if release_block:
              block = release_block.group(1)
              if re.search(r'(?m)^\s*release\s*\{', block):
                  s = re.sub(r'(?m)(^\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.worldOfExamRelease', s, count=1)
              else:
                  s = re.sub(r'(?m)(^\s*buildTypes\s*\{)', r'\1\n        release { signingConfig signingConfigs.worldOfExamRelease }', s, count=1)
          else:
              s = re.sub(r'(?m)^\}', '    buildTypes { release { signingConfig signingConfigs.worldOfExamRelease } }\n}', s, count=1)
          p.write_text(s)
          PY

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed public-release files
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfExam-Public-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
